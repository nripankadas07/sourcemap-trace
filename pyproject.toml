[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "sourcemap-trace"
version = "0.1.0"
description = "Offline flat v3 source-map tracing with VLQ validation and unmapped-span handling."
requires-python = ">=3.10"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = []
[project.scripts]
sourcemap-trace = "sourcemap_trace:main"
[tool.setuptools]
py-modules = ["sourcemap_trace"]
